name: GBA Link Selftest

on:
  push:
    branches: [main]
    paths:
      - "IodineGBA/core/RunLoop.js"
      - "IodineGBA/core/Serial.js"
      - "IodineGBA/core/Memory.js"
      - "user_scripts/LocalLinkSession.js"
      - "user_scripts/LinkCableBridge.js"
      - "app.js"
      - "index.html"
      - "link-lab/ci-link-selftest.mjs"
      - "link-lab/ci-rom-disasm.py"
      - ".github/workflows/link-selftest.yml"
  workflow_dispatch:

jobs:
  mario-link:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    strategy:
      fail-fast: false
      matrix:
        delay: [420]
        transfer_cycles: [5755]
        progressive: [0, 1]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install browser driver
        run: npm install --no-save puppeteer-core@24

      - name: Start local emulator server
        run: |
          python3 -m http.server 8000 --bind 127.0.0.1 > /tmp/ml3d-http.log 2>&1 &
          echo $! > /tmp/ml3d-http.pid
          for i in {1..20}; do
            if curl -fsS http://127.0.0.1:8000/ >/dev/null; then
              exit 0
            fi
            sleep 0.5
          done
          cat /tmp/ml3d-http.log
          exit 1

      - name: Run Super Mario Advance 4 dual-core selftest
        env:
          JOIN_DELAY: ${{ matrix.delay }}
          LINK_TRANSFER_CYCLES: ${{ matrix.transfer_cycles }}
          LINK_PROGRESSIVE: ${{ matrix.progressive }}
        run: node link-lab/ci-link-selftest.mjs

      - name: Disassemble protocol writer routines
        run: |
          python3 -m pip install --quiet capstone
          python3 link-lab/ci-rom-disasm.py

      - name: Upload selftest evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gba-link-selftest-${{ matrix.transfer_cycles }}-p${{ matrix.progressive }}-${{ matrix.delay }}
          path: artifacts/link-selftest-${{ matrix.delay }}
          if-no-files-found: warn
