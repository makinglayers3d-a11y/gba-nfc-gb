name: Adjust SP controls

on:
  push:
    paths:
      - '.github/workflows/adjust-sp-controls.yml'

permissions:
  contents: write

jobs:
  adjust:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align SP touch controls
        shell: python
        run: |
          from pathlib import Path
          p = Path('style.css')
          s = p.read_text()
          old = '''  body.sp-skin-test .dpad { position:absolute; left:10.3%; top:64.3%; width:34%; height:22%; margin:0; pointer-events:none; }
  body.sp-skin-test .dpad button { width:36%!important; height:36%!important; }
  body.sp-skin-test .dpad button[data-key="UP"] { left:32%!important; top:0!important; }
  body.sp-skin-test .dpad button[data-key="DOWN"] { left:32%!important; bottom:0!important; }
  body.sp-skin-test .dpad button[data-key="LEFT"] { left:0!important; top:32%!important; }
  body.sp-skin-test .dpad button[data-key="RIGHT"] { right:0!important; top:32%!important; }'''
          new = '''  /* Zonas tactiles ajustadas a la cruceta dibujada de la carcasa SP. */
  body.sp-skin-test .dpad { position:absolute; left:11.2%; top:66.1%; width:29.5%; height:17.7%; margin:0; pointer-events:none; }
  body.sp-skin-test .dpad button { width:38%!important; height:38%!important; }
  body.sp-skin-test .dpad button[data-key="UP"] { left:31%!important; top:0!important; }
  body.sp-skin-test .dpad button[data-key="DOWN"] { left:31%!important; top:62%!important; bottom:auto!important; }
  body.sp-skin-test .dpad button[data-key="LEFT"] { left:0!important; top:31%!important; }
  body.sp-skin-test .dpad button[data-key="RIGHT"] { left:62%!important; right:auto!important; top:31%!important; }'''
          if old not in s:
              raise SystemExit('Expected SP dpad block not found')
          p.write_text(s.replace(old, new))
          # Bump stylesheet cache key so phones receive the alignment immediately.
          i = Path('index.html')
          h = i.read_text()
          h = h.replace('style.css?v=sp-skin-4', 'style.css?v=sp-skin-5')
          i.write_text(h)
      - name: Commit published files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add style.css index.html
          git commit -m "Align SP touch controls with shell artwork"
          git push
