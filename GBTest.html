<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Prueba Game Boy / Game Boy Color</title>

  <style>
    html,
    body {
      margin: 0;
      padding: 0;
      background: #111;
      color: #fff;
      font-family: sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      box-sizing: border-box;
      padding: 20px;
    }

    #game {
      width: min(90vw, 640px);
    }

    #mainCanvas {
      width: 100%;
      height: auto;
      display: block;
      background: #000;

      image-rendering: pixelated;
      image-rendering: crisp-edges;
    }

    #status {
      opacity: 0.75;
      text-align: center;
    }
  </style>
</head>

<body>

  <h1>Prueba GB / GBC</h1>

  <div id="game">
    <canvas
      id="mainCanvas"
      width="160"
      height="144"
    >
      No Canvas Support
    </canvas>
  </div>

  <div id="status">
    Cargando emulador…
  </div>

  <script src="GB/binjgb.js"></script>
  <script src="GB/simple.js"></script>

  <script>
    document.getElementById("status").textContent =
      "Núcleo GB/GBC cargado.";
  </script>

</body>
</html>
